services:
  postgres:
    image: postgres:17
    container_name: olist-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: olist_dw
      POSTGRES_USER: olist_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U olist_user -d olist_dw"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: